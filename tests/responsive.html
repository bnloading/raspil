<!doctype html>
<html lang="kk">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мобильді дизайн тексеруі — тест деректері</title>
<link rel="stylesheet" href="/src/index.css">
<body>
<main style="padding:16px;max-width:1100px;margin:auto">
  <h1 style="font-size:1.2rem;margin-bottom:16px">Мобильді тексеру · тест деректері</h1>
  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-text"><div class="kpi-label">Жалпы сома</div><div class="kpi-value">123 456 789 ₸</div></div><span class="kpi-icon" aria-hidden="true">₸</span></div>
    <div class="kpi-card"><div class="kpi-text"><div class="kpi-label">Төленді</div><div class="kpi-value">98 765 432 ₸</div></div><span class="kpi-icon" aria-hidden="true">₸</span></div>
  </div>
  <div class="worker-stat worker-salary-teaser" style="margin:16px 0"><div><div class="worker-stat-cap">Жалақы</div><div class="worker-salary-amount">1 234 567 ₸</div></div></div>
  <div class="journal-card-summary">
    <div class="journal-card-stat"><span>Жалпы</span><strong>123 456 789 ₸</strong></div>
    <div class="journal-card-stat"><span>Қарыз</span><strong class="is-debt">24 691 357 ₸</strong></div>
  </div>
  <div class="journal-card is-uncut">
    <button class="journal-card-main" type="button">
      <div class="journal-card-top"><strong>ORD-2026-000008</strong><span class="journal-card-date">09.09.2026</span></div>
      <div class="journal-card-client">Ұзын клиент атауы — тест тапсырысы</div>
      <div class="journal-card-facts">
        <span class="journal-card-fact"><span class="journal-card-fact-text"><b>125 лист</b><small>ЛДСП Ақ</small></span></span>
        <span class="journal-card-fact"><span class="journal-card-fact-text"><b>1 250 м ПВХ</b><small>Ақ · 1 мм</small></span></span>
      </div>
      <div class="journal-card-money"><span class="journal-card-total">12 345 678 ₸</span><span class="jt-pill jt-pay-partial">Жартылай төленді</span></div>
      <div class="journal-card-owing">Қарыз: 1 234 567 ₸</div>
    </button>
    <button class="btn btn-primary btn-full journal-card-action" type="button">Распилға жіберу</button>
  </div>
  <div class="panel-card"><div class="rdash-big">123 456 789 ₸</div><div class="rdash-cap">Есептердегі жалпы сома</div></div>
</main>
</body>
</html>
